name: Build

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build extension
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm type-check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Package browser builds
        run: pnpm zip:all

      - name: Upload extension packages
        uses: actions/upload-artifact@v4
        with:
          name: extension-zips
          path: .output/**/*.zip
          if-no-files-found: error
          include-hidden-files: true

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    # 只在 tag 推送时发版。tag 由人按规则打好（见 AGENTS.md「发版流程」）：
    # 一个 `chore: release v.X.Y.Z` 提交 + 打在它上面的同名 tag。
    # main 推送只构建、不发版。
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve release tag
        id: release_tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          TAG_NAME="$GITHUB_REF_NAME"
          EXPECTED="v${VERSION}"

          # tag 名必须和 package.json 的版本对得上
          if [ "$TAG_NAME" != "$EXPECTED" ]; then
            echo "::error::tag ${TAG_NAME} 与 package.json 的版本 ${VERSION} 对不上（应该是 ${EXPECTED}）"
            exit 1
          fi

          # 发版提交的信息必须正好是 "chore: release v.X.Y.Z"
          SUBJECT="$(git log -1 --format=%s HEAD)"
          if [ "$SUBJECT" != "chore: release ${TAG_NAME}" ]; then
            echo "::error::发版提交的标题必须是「chore: release ${TAG_NAME}」，实际是「${SUBJECT}」"
            exit 1
          fi

          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"

      - name: Download extension packages
        uses: actions/download-artifact@v4
        with:
          name: extension-zips
          path: release-artifacts

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.release_tag.outputs.tag_name }}
        run: |
          mapfile -t ZIP_FILES < <(find release-artifacts -type f -name '*.zip' | sort)
          if [ "${#ZIP_FILES[@]}" -eq 0 ]; then
            echo "No packaged extension zip files found." >&2
            exit 1
          fi

          gh release create "$TAG_NAME" "${ZIP_FILES[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TAG_NAME" \
            --generate-notes
